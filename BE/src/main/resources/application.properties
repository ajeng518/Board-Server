#spring.application.name=boardserver

spring.profiles.active=local
spring.profiles.group.local=db-local
spring.profiles.include=security


#mysql-local
spring.datasource.driver-class-name=${database.driver}
spring.datasource.jdbc-url=${database.url}
spring.datasource.username=${database.username}
spring.datasource.password=${database.password}

mybatis.mapper-locations=${mybatis.mapper-locations}

#redis
spring.cache.type=${redis.cache.type}
spring.data.redis.host=${redis.host}
spring.data.redis.port=${redis.port}
spring.data.redis.password=${redis.password}
spring.data.redis.repositories.enabled=${redis.repositories.enabled}
expire.defaultTime= ${redis.expire.defaultTime}